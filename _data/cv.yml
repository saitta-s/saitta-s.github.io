- title: Profile
  type: list
  contents:
    - I develop data-driven methods to make cardiovascular imaging more quantitative and objective. My work brings together deep learning, computational modeling, physics, and image analysis to support diagnosis, treatment planning, and image-guided cardiovascular procedures.

- title: Experience
  type: time_table
  contents:
    - title: Assistant Professor in Cardiovascular Image Analysis
      institution: Amsterdam UMC — Dept. of Biomedical Engineering &amp; Physics, The Netherlands
      year: 2024 - now
      description:
        - Manager of the CARA Lab (a joint initiative of Amsterdam UMC, Radboudumc and Abbott Vascular) — development and clinical validation of AI systems that analyse intracoronary optical coherence tomography (OCT) in real time during procedures in the catheterization laboratory.
        - Lead an independent research line on Marfan syndrome, combining medical imaging, biomechanics and machine learning to quantify a patient's risk of aortic-disease progression.
        - Deep learning for coronary plaque characterisation and detection of thin-cap fibroatheromas, and geometric deep learning as a fast surrogate for blood-flow simulation.
        - Visiting Researcher, Diagnostic Image Analysis Group (DIAG), Radboudumc.

    - title: Junior Assistant Professor / Postdoctoral Research Fellow
      institution: Politecnico di Milano, Italy
      year: 2023 - 2024
      description:
        - Graph neural networks as fast surrogates for cardiovascular biomechanics, turning simulations that normally take hours into near-instant predictions.
        - Co-supervised two doctoral candidates.

    - title: Doctoral Researcher in Bioengineering
      institution: Politecnico di Milano, Italy
      year: 2019 - 2023
      description:
        - Deep neural networks for automatic 3D segmentation of medical images (CT, MRI and 3D transesophageal echocardiography).
        - Mixed-reality system for neurosurgical guidance (MICCAI 2022; led to a filed patent).
        - Unsupervised reconstruction of moving 3D blood-flow fields from MRI (implicit neural representations).
        - 4D variational data assimilation for cerebral-aneurysm haemodynamics.

    - title: Visiting Doctoral Researcher
      institution: University of Cambridge (DAMTP) &amp; Cambridge Image Analysis Group, UK
      year: 2022
      description:
        - Inverse problems in imaging — unsupervised denoising and super-resolution of flow-encoded MRI (host&#58; Prof. Carola-Bibiane Schönlieb).

    - title: Research Engineer
      institution: National University of Singapore
      year: 2018 - 2019
      description:
        - Multi-view 4D image registration for fetal heart echocardiography (host&#58; Prof. C.H. Yap).

    - title: Research Assistant
      institution: Imperial College London, UK
      year: 2018
      description:
        - Non-invasive pressure estimation from MRI; computational fluid dynamics of aortic dissection (host&#58; Prof. X.Y. Xu).

